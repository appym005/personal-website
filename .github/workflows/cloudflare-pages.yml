name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 pages project create personal-website --production-branch main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 pages deploy . --project-name personal-website --branch main

      - name: Diagnose Pages routing and app-ads.txt
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Cloudflare Pages project ==="
          curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/personal-website" \
            | jq '{success, errors, project: (.result | {name, subdomain, production_branch, domains, latest_deployment: (.latest_deployment | {id, url, environment})})}'
          echo "=== Cloudflare Pages custom domain assignments ==="
          curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/personal-website/domains" \
            | jq '{success, errors, domains: [.result[]? | {name, status, validation_data}]}'
          echo "=== Public URL responses ==="
          for url in \
            "https://personal-website-dtz.pages.dev/app-ads.txt" \
            "https://touchstonegames.in/app-ads.txt" \
            "https://www.touchstonegames.in/app-ads.txt"; do
            echo "--- $url ---"
            curl -sSL --max-time 25 -o /tmp/app-ads-check-body \
              -w 'HTTP_STATUS=%{http_code} FINAL_URL=%{url_effective} CONTENT_TYPE=%{content_type}\\n' \
              "$url" || true
            if test -f /tmp/app-ads-check-body; then
              head -c 180 /tmp/app-ads-check-body; echo
            fi
          done

      - name: Diagnose apex DNS ownership and existing homepage
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Authoritative public DNS ==="
          for type in NS A AAAA CNAME; do
            echo "--- $type ---"
            dig +short touchstonegames.in "$type" || true
          done
          echo "--- WWW CNAME ---"
          dig +short www.touchstonegames.in CNAME || true
          echo "=== Domain homepage responses ==="
          for url in https://touchstonegames.in/ https://www.touchstonegames.in/; do
            echo "--- $url ---"
            curl -sSL --max-time 20 -D /tmp/domain-headers -o /tmp/domain-body \
              -w 'HTTP_STATUS=%{http_code} FINAL_URL=%{url_effective}\\n' "$url" || true
            grep -i -E '^(HTTP/|server:|cf-ray:|location:|content-type:)' /tmp/domain-headers || true
            grep -i -m 1 -o '<title>[^<]*</title>' /tmp/domain-body || true
          done
          echo "=== Cloudflare zone API ==="
          curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=touchstonegames.in" \
            | jq '{success, errors, zones: [.result[]? | {id, name, status, name_servers}]}'
